# ============================================================================
# Lighting environment — canonical, runtime-tunable lighting / fog standard.
# Edited here and re-applied in-engine (no recompile) to iterate on the look.
# Vec3 values are written as "r g b". Float values are plain numbers.
# ============================================================================

# --- directional sun (surface -> sun; the shadow cascades look along -dir) ---
sun_direction = 0.5 1.0 0.3
sun_color = 1.0 0.96 0.88
sun_intensity = 1.0

# --- ambient fill (sky-light on up faces / ground bounce on down faces) ------
sky_light_color = 0.45 0.52 0.62   # muted (de-saturated) sky
ground_bounce = 0.35 0.24 0.12     # warm earth
ambient_strength = 0.30

# --- height fog ----------------------------------------------------------------
fog_enabled = true                      # warm height fog: restores the atmospheric tint so the
                                        # terrain texture reads true colour (blue wash shows
                                        # when the fog is off — keep ON for the look).
fog_horizon = 0.45 0.38 0.32       # warm valley mist
fog_zenith = 0.20 0.30 0.45        # muted sky overhead (reduces the blue)
fog_near = 150
fog_far = 900
fog_height = 8                     # mist pools below this elevation (metres)
fog_height_falloff = 0.08
fog_max_opacity = 0.65             # cap so distant terrain stays readable

# --- surface detail ----------------------------------------------------------
detail_normal_strength = 0.45
sky_light_strength = 0.18

# --- shadows -----------------------------------------------------------------
shadows_enabled = true

# --- water -------------------------------------------------------------------
water_level = 0.0     # y of the procedural water plane (0 = sea/coast level).
                      # Raise to flood valleys; lower to expose more seabed.
